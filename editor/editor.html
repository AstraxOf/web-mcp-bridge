<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="ed.title">MCP Editor · Web MCP Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="editor.css">
  <script src="../shared/i18n.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <h1>MCP <span>Editor</span> <small id="version" class="version"></small></h1>
    </div>
    <div class="top-actions">
      <div class="bridge-chip" id="bridge-chip">
        <i id="bridge-dot" class="dot connecting"></i>
        <span id="bridge-text">Checking…</span>
      </div>
      <button id="bridge-toggle" type="button" class="ghost" disabled><span>Start</span></button>
      <button id="bridge-restart" type="button" class="ghost" disabled><span data-i18n="ed.restart">Restart</span></button>
      <div class="seg" id="lang-seg" role="group" data-i18n-aria="lang.switch" aria-label="Language">
        <button type="button" data-lang="en" title="English">EN</button>
        <button type="button" data-lang="es" title="Español">ES</button>
      </div>
      <button id="theme-btn" type="button" class="ghost icon" aria-label="Theme"></button>
    </div>
  </header>

  <p id="banner" class="callout warn" hidden></p>

  <main class="bento">
    <!-- Editor -->
    <section class="tile tile-editor">
      <div class="toolbar">
        <div class="file">
          <strong>servers.json</strong>
          <small id="path" class="muted"></small>
        </div>
        <div class="toolbar-actions">
          <button id="b-reload" type="button" class="ghost" data-i18n-title="ed.reloadTip"><span data-i18n="ed.reload">Reload</span></button>
          <button id="b-format" type="button" class="ghost" data-i18n-title="ed.formatTip"><span data-i18n="ed.format">Format</span></button>
          <button id="b-download" type="button" class="ghost" data-i18n-title="ed.downloadTip"><span data-i18n="ed.download">Download</span></button>
          <button id="b-save" type="button" class="primary" disabled><span data-i18n="ed.save">Save</span></button>
        </div>
      </div>
      <div class="code">
        <pre id="gutter" aria-hidden="true">1</pre>
        <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-aria="ed.editorAria" aria-label="servers.json contents"></textarea>
      </div>
      <div class="statusbar">
        <span id="status" class="status" data-i18n="ed.loading">Loading…</span>
        <span id="dirty" class="muted"></span>
      </div>
      <ul id="issues" class="issues" hidden></ul>
    </section>

    <!-- New MCP -->
    <section class="tile tile-add">
      <h2 data-i18n="ed.new">New MCP</h2>
      <div id="templates" class="chips" data-i18n-aria="ed.templates" aria-label="Templates"></div>

      <div class="fields">
        <label class="field"><span data-i18n="ed.f.name">Name</span><input id="f-name" type="text" placeholder="my-mcp" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span data-i18n="ed.f.cmd">Command</span><input id="f-cmd" type="text" placeholder="python -m my_mcp" autocomplete="off" spellcheck="false"></label>

        <details class="more">
          <summary data-i18n="ed.f.options">Options</summary>
          <div class="fields inner">
            <label class="field"><span data-i18n="ed.f.port">Port</span><input id="f-port" type="number" min="1" max="65535" step="1"></label>
            <label class="field"><span data-i18n="ed.f.cwd">Folder</span><input id="f-cwd" type="text" placeholder="C:/project" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="ed.f.env">Variables</span><textarea id="f-env" rows="2" spellcheck="false" data-i18n-ph="ed.f.envPh" placeholder="KEY=value"></textarea></label>
          </div>
        </details>
      </div>

      <p id="form-error" class="callout bad" hidden></p>
      <div class="actions">
        <button id="f-add" type="button" class="primary wide"><span data-i18n="ed.add">Add</span></button>
        <button id="f-clear" type="button" class="ghost"><span data-i18n="ed.clear">Clear</span></button>
      </div>
    </section>

    <!-- Import -->
    <section class="tile tile-import">
      <details>
        <summary><h2 data-i18n="ed.import">Import JSON</h2></summary>
        <div class="fields inner">
          <textarea id="import-text" rows="5" spellcheck="false" placeholder='{ "mcpServers": { … } }'></textarea>
          <p id="import-error" class="callout bad" hidden></p>
          <div class="actions"><button id="import-btn" type="button" class="ghost wide"><span data-i18n="ed.importBtn">Import</span></button></div>
        </div>
      </details>
    </section>
  </main>

  <footer class="app-foot"><span id="version-line"></span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
